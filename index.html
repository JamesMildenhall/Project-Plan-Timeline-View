<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EX27 Ops - Live Gantt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/vis-timeline/7.7.3/vis-timeline-graph2d.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-timeline/7.7.3/vis-timeline-graph2d.min.js"></script>
<style>
:root{
  --s21-blue:#0D0C4E;
  --s21-blue-2:#08072F;
  --s21-blue-3:#141370;
  --s21-blue-4:#1E1D82;
  --s21-mal:#1AE279;
  --s21-turq:#49D8CD;
  --s21-slate:#3E6680;
  --s21-mslate:#6960EC;
  --s21-pink:#E21A83;
  --s21-grey:#6B7280;
  --ink:#EEF2FF;
  --ink-2:#B7BEE0;
  --line:rgba(255,255,255,.08);
  --panel:rgba(255,255,255,.03);
  --panel-2:rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--s21-blue-2);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px;background:linear-gradient(180deg,var(--s21-blue) 0%, var(--s21-blue-2) 100%);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0}
header h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0;color:#fff}
header h1 .mal{color:var(--s21-mal)}
header .sub{font-size:11px;color:var(--ink-2);letter-spacing:.06em}
header .spacer{flex:1}
header .stat{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.1em}
header .stat b{color:#fff;font-weight:600}

.controls{padding:12px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:var(--s21-blue);border-bottom:1px solid var(--line);flex-shrink:0}
.ctrl{display:flex;flex-direction:column;gap:4px;position:relative}
.ctrl label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.ctrl input[type=text]{background:var(--s21-blue-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:12px;outline:none}
.ctrl input[type=text]:focus{border-color:var(--s21-mal)}

/* Custom checkbox dropdown */
.dd{position:relative}
.dd-btn{width:100%;background:var(--s21-blue-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:12px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;outline:none}
.dd-btn:hover{border-color:var(--s21-mal)}
.dd-btn.active{border-color:var(--s21-mal)}
.dd-btn .dd-count{background:var(--s21-mal);color:var(--s21-blue);font-weight:700;font-size:10px;padding:1px 7px;border-radius:999px;flex-shrink:0}
.dd-btn .dd-arrow{color:var(--ink-2);font-size:10px;flex-shrink:0}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--s21-blue);border:1px solid var(--s21-mal);border-radius:8px;padding:8px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;min-width:220px}
.dd-panel.open{display:block}
.dd-search{width:100%;background:var(--s21-blue-2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:11px;font-family:inherit;outline:none;margin-bottom:6px}
.dd-actions{display:flex;gap:6px;margin-bottom:6px}
.dd-actions button{flex:1;background:transparent;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-family:inherit;font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.dd-actions button:hover{color:var(--s21-mal);border-color:var(--s21-mal)}
.dd-list{max-height:220px;overflow-y:auto}
.dd-list label{display:flex;align-items:center;gap:8px;padding:4px 6px;cursor:pointer;border-radius:4px;font-size:12px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
.dd-list label:hover{background:var(--s21-blue-2)}
.dd-list input[type=checkbox]{accent-color:var(--s21-mal);flex-shrink:0}

.buttons{padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;background:var(--s21-blue);border-bottom:1px solid var(--line);flex-shrink:0}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--s21-mal);color:var(--s21-mal)}
.btn.active{background:var(--s21-mal);color:var(--s21-blue);border-color:var(--s21-mal)}
.btn.ghost{opacity:.7}

.legend{padding:8px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--s21-blue-2);border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-2);flex-shrink:0}
.legend .chip{display:inline-flex;align-items:center;gap:6px}
.legend .swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .swatch.diamond{transform:rotate(45deg);border-radius:2px}
.legend .swatch.circle{border-radius:50%}
.legend .swatch.triangle{width:0;height:0;background:transparent;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #fff}
.legend .divider{width:1px;height:14px;background:var(--line)}

main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
#timeline{flex:1;min-height:0;background:var(--s21-blue-2);overflow:hidden}

/* vis-timeline dark overrides */
.vis-timeline{border:none !important;font-family:'Montserrat',sans-serif}
.vis-panel.vis-center,.vis-panel.vis-left,.vis-panel.vis-right,.vis-panel.vis-top,.vis-panel.vis-bottom{border-color:var(--line) !important}
.vis-panel .vis-shadow{box-shadow:none}
.vis-labelset .vis-label{color:var(--ink);border-color:var(--line) !important;background:var(--s21-blue-2)}
.vis-labelset .vis-label.vis-nesting-group{background:linear-gradient(90deg,var(--s21-blue-3),var(--s21-blue-2));font-weight:600}
.vis-labelset .vis-label .vis-inner{padding:6px 8px;font-size:12px;width:100%}
.vis-left .vis-labelset{width:420px}
.vis-left{width:420px !important}
.vis-foreground .vis-group{border-color:var(--line) !important}
.vis-time-axis .vis-text{color:var(--ink-2);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.vis-time-axis .vis-grid.vis-minor{border-color:rgba(255,255,255,.04) !important}
.vis-time-axis .vis-grid.vis-major{border-color:rgba(255,255,255,.08) !important}
.vis-time-axis .vis-grid.vis-vertical{border-color:rgba(255,255,255,.04) !important}
.vis-current-time{background:var(--s21-mal) !important;width:2px !important;z-index:2}

.vis-item{border-width:0;border-radius:4px;font-size:11px;color:#fff;font-weight:500}
.vis-item.vis-range{padding:2px 8px}
.vis-item.vis-selected{box-shadow:0 0 0 2px var(--s21-mal)}

/* point items: hide default content label, style the dot as the shape */
.vis-item.vis-point{background:transparent !important;border:none !important;height:20px;overflow:visible !important}
.vis-item.vis-point .vis-item-content{display:none !important}
.vis-item.vis-point .vis-dot{
  width:16px !important; height:16px !important;
  border:none !important; border-radius:0 !important;
  background:transparent !important;
  transform:translate(-50%, -50%);
  top:50% !important; left:0 !important;
  position:absolute;
}
.vis-item.vis-point.shape-dot .vis-dot{
  background:currentColor !important; border-radius:50% !important;
}
.vis-item.vis-point.shape-rhombus .vis-dot{
  background:currentColor !important;
  transform:translate(-50%, -50%) rotate(45deg);
  width:13px !important; height:13px !important;
}
.vis-item.vis-point.shape-triangle .vis-dot{
  width:0 !important; height:0 !important;
  background:transparent !important;
  border-left:9px solid transparent !important;
  border-right:9px solid transparent !important;
  border-bottom:16px solid currentColor !important;
  transform:translate(-50%, -60%);
}
.vis-item.vis-point.c-complete{color:var(--s21-mal)}
.vis-item.vis-point.c-ontrack{color:var(--s21-turq)}
.vis-item.vis-point.c-atrisk{color:var(--s21-pink)}
.vis-item.vis-point.c-notstarted{color:var(--s21-slate)}
.vis-item.vis-point.c-noupdate{color:var(--s21-mslate)}
.vis-item.vis-point.c-tbc{color:var(--s21-grey)}
.vis-item.vis-point.c-unknown{color:#4B5563}

/* status colours for range bars */
.st-complete{background:var(--s21-mal) !important;color:#0D0C4E !important;font-weight:700}
.st-ontrack{background:var(--s21-turq) !important;color:#0D0C4E !important;font-weight:600}
.st-atrisk{background:var(--s21-pink) !important}
.st-notstarted{background:var(--s21-slate) !important}
.st-noupdate{background:var(--s21-mslate) !important}
.st-tbc{background:var(--s21-grey) !important}
.st-unknown{background:#4B5563 !important;opacity:.7}

/* summary bar for parents whose children are showing */
.vis-item.summary{background:transparent !important;border:1px dashed rgba(26,226,121,.55) !important;border-radius:3px;height:10px;padding:0 !important}
.vis-item.summary .vis-item-content{display:none}

/* row labels: structured columns instead of one long string */
.vis-labelset .vis-label .vis-inner{padding:6px 8px !important;font-size:12px;width:100%;display:block !important;box-sizing:border-box}
.vis-labelset .vis-label .vis-inner .row-line{display:flex !important;align-items:center;gap:6px;font-size:12px;white-space:nowrap;overflow:hidden;width:100%}
.vis-labelset .vis-label .vis-inner .row-line .indent{display:inline-block;flex-shrink:0;width:0}
.vis-labelset .vis-label .vis-inner .row-line.tier-2 .indent{width:10px}
.vis-labelset .vis-label .vis-inner .row-line.tier-3 .indent{width:22px}
.vis-labelset .vis-label .vis-inner .row-line.tier-4 .indent{width:34px}
.vis-labelset .vis-label .vis-inner .row-line .chevron{color:var(--s21-mal);font-size:9px;width:12px;text-align:center;flex-shrink:0}
.vis-labelset .vis-label .vis-inner .row-line .tier-pill{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:3px;flex-shrink:0;min-width:26px;text-align:center;line-height:1.2}
.vis-labelset .vis-label .vis-inner .row-line .tier-pill.t-1{background:#1AE279;color:#0D0C4E}
.vis-labelset .vis-label .vis-inner .row-line .tier-pill.t-2{background:#49D8CD;color:#0D0C4E}
.vis-labelset .vis-label .vis-inner .row-line .tier-pill.t-3{background:#6960EC;color:#fff}
.vis-labelset .vis-label .vis-inner .row-line .tier-pill.t-4{background:rgba(255,255,255,.18);color:#fff}
.vis-labelset .vis-label .vis-inner .row-line .tier-pill.t-x{background:rgba(255,255,255,.08);color:var(--ink-2)}
.vis-labelset .vis-label .vis-inner .row-line .ref-pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:3px;background:rgba(26,226,121,.15);color:#1AE279;border:1px solid rgba(26,226,121,.45);flex-shrink:0;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;line-height:1.2}
.vis-labelset .vis-label .vis-inner .row-line .deliv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink);white-space:nowrap}
.vis-labelset .vis-label .vis-inner .row-line .deliv.parent{color:#fff;font-weight:600}
.vis-labelset .vis-label .vis-inner .row-line .deliv.child{color:var(--ink-2);font-weight:400}
.vis-labelset .vis-label .vis-inner .row-line .sme-pill{display:inline-block;font-size:9px;letter-spacing:.03em;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.08);color:var(--ink-2);border:1px solid var(--line);flex-shrink:0;max-width:110px;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.vis-labelset .vis-label .vis-inner .row-line .dept-name{letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:#fff;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis}
.vis-labelset .vis-label .vis-inner .row-line .dept-count{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--s21-mal);color:#0D0C4E;flex-shrink:0;line-height:1.2}

.tt{background:var(--s21-blue);color:var(--ink);border:1px solid var(--s21-mal);border-radius:8px;padding:10px 12px;font-size:12px;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.5);font-family:'Montserrat',sans-serif}
.tt h4{margin:0 0 6px 0;font-size:13px;font-weight:700;color:#fff}
.tt .tt-row{display:flex;gap:8px;margin:3px 0}
.tt .tt-k{color:var(--ink-2);font-size:10px;letter-spacing:.08em;text-transform:uppercase;min-width:80px;font-weight:600}
.tt .tt-v{color:#fff;font-size:11px}
.tt .st-pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

.drawer{background:var(--s21-blue);border-top:1px solid var(--line);flex-shrink:0;display:none;flex-direction:column;max-height:35vh}
.drawer.open{display:flex}
.drawer .inner{padding:12px 20px;overflow:auto;flex:1}
.drawer h3{margin:0 0 8px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--s21-mal)}
.drawer table{width:100%;border-collapse:collapse;font-size:11px}
.drawer th,.drawer td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.drawer th{color:var(--ink-2);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:10px;position:sticky;top:0;background:var(--s21-blue)}

.error-panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--s21-blue-2);z-index:10}
.error-card{background:var(--s21-blue);border:1px solid var(--s21-pink);border-radius:12px;padding:24px 28px;max-width:520px;text-align:left}
.error-card h2{margin:0 0 8px 0;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--s21-pink)}
.error-card p{margin:8px 0;font-size:13px;color:var(--ink-2);line-height:1.5}
.error-card code{background:var(--s21-blue-2);padding:2px 6px;border-radius:4px;font-size:11px;color:var(--s21-mal)}
.hidden{display:none !important}

.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--s21-blue-2);z-index:9;flex-direction:column;gap:14px}
.spinner{width:36px;height:36px;border:3px solid rgba(26,226,121,.15);border-top-color:var(--s21-mal);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

.count-badge{display:inline-block;background:var(--s21-mal);color:var(--s21-blue);border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700;margin-left:6px}

@media (max-width: 720px){
  header h1{font-size:12px}
  .controls{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
  <h1>EX27 <span class="mal">/</span> Operations Live Gantt</h1>
  <span class="sub">Source: <code style="font-size:10px;background:var(--s21-blue-2);padding:2px 6px;border-radius:3px;color:var(--s21-mal)">EX27_Ops_Project_Plan_v4.xlsx</code></span>
  <div class="spacer"></div>
  <div class="stat">Rows loaded <b id="stat-rows">0</b></div>
  <div class="stat">On timeline <b id="stat-visible">0</b></div>
  <div class="stat">Undated <b id="stat-undated">0</b></div>
</header>

<div class="controls">
  <div class="ctrl">
    <label>Department</label>
    <div class="dd" data-key="dept">
      <button class="dd-btn" type="button"><span class="dd-lbl">All departments</span><span class="dd-count hidden">0</span><span class="dd-arrow">▾</span></button>
      <div class="dd-panel"></div>
    </div>
  </div>
  <div class="ctrl">
    <label>Status</label>
    <div class="dd" data-key="status">
      <button class="dd-btn" type="button"><span class="dd-lbl">All statuses</span><span class="dd-count hidden">0</span><span class="dd-arrow">▾</span></button>
      <div class="dd-panel"></div>
    </div>
  </div>
  <div class="ctrl">
    <label>Tier</label>
    <div class="dd" data-key="tier">
      <button class="dd-btn" type="button"><span class="dd-lbl">All tiers</span><span class="dd-count hidden">0</span><span class="dd-arrow">▾</span></button>
      <div class="dd-panel"></div>
    </div>
  </div>
  <div class="ctrl">
    <label>Type</label>
    <div class="dd" data-key="type">
      <button class="dd-btn" type="button"><span class="dd-lbl">All types</span><span class="dd-count hidden">0</span><span class="dd-arrow">▾</span></button>
      <div class="dd-panel"></div>
    </div>
  </div>
  <div class="ctrl">
    <label>Search deliverable</label>
    <input type="text" id="f-search" placeholder="Type to filter..." />
  </div>
</div>

<div class="buttons">
  <button class="btn" data-scale="day">Day</button>
  <button class="btn active" data-scale="week">Week</button>
  <button class="btn" data-scale="month">Month</button>
  <span style="width:1px;background:var(--line);align-self:stretch;margin:0 4px"></span>
  <button class="btn" id="btn-today">Jump to Today</button>
  <button class="btn" id="btn-expo">Jump to Expo Window</button>
  <span style="width:1px;background:var(--line);align-self:stretch;margin:0 4px"></span>
  <button class="btn" id="btn-milestones">Milestones only</button>
  <button class="btn" id="btn-pct">Show % Complete</button>
  <button class="btn" id="btn-drawer">Show Undated <span class="count-badge" id="undated-badge">0</span></button>
  <div class="spacer" style="flex:1"></div>
  <button class="btn ghost" id="btn-reset">Reset filters</button>
</div>

<div class="legend" id="legend"></div>

<main>
  <div class="loader" id="loader"><div class="spinner"></div><p>Loading tracker...</p></div>
  <div class="error-panel hidden" id="error">
    <div class="error-card">
      <h2>Could not load the tracker</h2>
      <p id="error-msg"></p>
      <p style="margin-top:14px"><button class="btn" id="btn-retry">Retry</button></p>
    </div>
  </div>
  <div id="timeline"></div>
</main>

<div class="drawer" id="drawer">
  <div class="inner">
    <h3>Undated deliverables <span class="count-badge" id="drawer-count">0</span></h3>
    <table id="undated-table">
      <thead><tr><th>REF</th><th>Department</th><th>Tier</th><th>Type</th><th>Deliverable</th><th>Status</th><th>SME</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
// ---------- config ----------
const FILE_URL = './EX27_Ops_Project_Plan_v4.xlsx';
const SHEET_NAME = 'Tracker';

const STATUS_MAP = {
  'Complete': {key:'complete', label:'Complete', cls:'st-complete', mark:'c-complete', color:'#1AE279'},
  'On Track': {key:'ontrack', label:'On Track', cls:'st-ontrack', mark:'c-ontrack', color:'#49D8CD'},
  'At Risk':  {key:'atrisk',  label:'At Risk',  cls:'st-atrisk', mark:'c-atrisk',  color:'#E21A83'},
  'Not Started': {key:'notstarted', label:'Not Started', cls:'st-notstarted', mark:'c-notstarted', color:'#3E6680'},
  'No Update Received': {key:'noupdate', label:'No Update Received', cls:'st-noupdate', mark:'c-noupdate', color:'#6960EC'},
  'TBC': {key:'tbc', label:'TBC', cls:'st-tbc', mark:'c-tbc', color:'#6B7280'},
  'Unknown': {key:'unknown', label:'Unknown', cls:'st-unknown', mark:'c-unknown', color:'#4B5563'}
};

function normStatus(s){
  if(!s) return 'Unknown';
  const t = String(s).trim();
  if(!t || t.toLowerCase()==='none') return 'Unknown';
  if(t.toLowerCase()==='not started') return 'Not Started';
  if(t.toLowerCase().startsWith('tbc')) return 'TBC';
  return t;
}
function normDept(d){
  if(!d) return 'Unassigned';
  const t = String(d).trim();
  if(!t || t.toLowerCase()==='none' || t.toLowerCase()==='tbc') return 'Unassigned';
  return t;
}
function excelDate(v){
  if(v === null || v === undefined || v === '') return null;
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    const epoch = new Date(Date.UTC(1899,11,30));
    return new Date(epoch.getTime() + v*86400000);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

// ---------- state ----------
let RAW = [];
let ROWS = [];
let GROUPS = new vis.DataSet();
let ITEMS = new vis.DataSet();
let timeline;
let showPct = false;
let milestonesOnly = false;
let filters = {dept:new Set(), status:new Set(), tier:new Set(), type:new Set(), search:''};
let filterOptions = {dept:[], status:[], tier:[], type:[]};

// ---------- load ----------
async function load(){
  document.getElementById('loader').classList.remove('hidden');
  document.getElementById('error').classList.add('hidden');
  try{
    const resp = await fetch(FILE_URL, {cache:'no-store'});
    if(!resp.ok) throw new Error(`Fetch failed: HTTP ${resp.status} for ${FILE_URL}. Is the file next to index.html in the repo?`);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    if(!wb.SheetNames.includes(SHEET_NAME)) throw new Error(`Sheet "${SHEET_NAME}" not found. Sheets: ${wb.SheetNames.join(', ')}`);
    const ws = wb.Sheets[SHEET_NAME];
    const range = XLSX.utils.decode_range(ws['!ref']);
    range.s.r = 0; range.s.c = 0;
    const rawGrid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, range: XLSX.utils.encode_range(range), blankrows:true});
    const need = ['Tier','Type','Department','REF','Deliverable','Owner / Support','SME / SME','Start Date','End Date','Status','Comment','% Complete'];
    let hdrIdx = -1;
    for(let i=0;i<Math.min(rawGrid.length, 25);i++){
      const row = rawGrid[i] || [];
      const names = row.map(c => c==null?'':String(c).trim().toLowerCase());
      if(names.includes('deliverable') && names.includes('tier') && names.includes('start date')){
        hdrIdx = i; break;
      }
    }
    if(hdrIdx === -1) throw new Error(`Could not find header row. Looked for a row containing "Tier", "Deliverable" and "Start Date" in the first 25 rows of sheet "${SHEET_NAME}".`);
    const hdr = rawGrid[hdrIdx];
    const missing = need.filter(n => !hdr.some(h => h && String(h).trim().toLowerCase() === n.toLowerCase()));
    if(missing.length) throw new Error(`Header row (detected at row ${hdrIdx+1}) is missing expected columns: ${missing.join(', ')}. Got: ${hdr.filter(Boolean).join(', ')}`);
    const norm = hdr.map(h => h ? String(h).trim() : '');
    RAW = [];
    for(let i=hdrIdx+1;i<rawGrid.length;i++){
      const r = rawGrid[i]; if(!r || !r.some(v => v!==null && v!==undefined && v!=='')) continue;
      const o = {};
      norm.forEach((k,idx) => { if(k) o[k] = r[idx]; });
      RAW.push(o);
    }
    build();
    document.getElementById('loader').classList.add('hidden');
  }catch(err){
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('error-msg').innerHTML = String(err.message || err);
    console.error(err);
  }
}

// ---------- transform ----------
function build(){
  ROWS = RAW.map((r,i) => {
    const ref = (r['REF']==null?'':String(r['REF'])).trim();
    const dept = normDept(r['Department']);
    const status = normStatus(r['Status']);
    const tier = r['Tier']==null?null:Number(r['Tier']);
    const sd = excelDate(r['Start Date']);
    const ed = excelDate(r['End Date']);
    return {
      id: i,
      ref,
      dept,
      tier,
      type: (r['Type']||'').toString().trim(),
      deliverable: (r['Deliverable']||'').toString().trim(),
      description: (r['Description of Service']||'').toString().trim(),
      owner: (r['Owner / Support']||'').toString().trim(),
      sme: (r['SME / SME']||'').toString().trim(),
      start: sd,
      end: ed,
      status,
      statusMeta: STATUS_MAP[status] || STATUS_MAP['Unknown'],
      comment: (r['Comment']||'').toString().trim(),
      pctRaw: r['% Complete'],
      parentRef: parentOf(ref),
      childrenIds: [],
    };
  });

  // parent-child by REF prefix
  const byRef = {};
  ROWS.forEach(r => { if(r.ref) byRef[r.ref] = r; });
  ROWS.forEach(r => {
    if(r.parentRef && byRef[r.parentRef]){
      byRef[r.parentRef].childrenIds.push(r.id);
    }
  });

  // derived % complete from descendant leaves
  function descLeaves(id, out){
    const r = ROWS[id];
    if(!r.childrenIds.length){ out.push(r); return; }
    r.childrenIds.forEach(c => descLeaves(c, out));
  }
  ROWS.forEach(r => {
    if(r.childrenIds.length){
      const leaves = []; descLeaves(r.id, leaves);
      const scored = leaves.filter(l => l.status !== 'Unknown' && l.status !== 'TBC');
      if(scored.length){
        const complete = scored.filter(l => l.status === 'Complete').length;
        r.pctCalc = Math.round(100 * complete / scored.length);
      } else r.pctCalc = null;
    } else {
      r.pctCalc = (r.status === 'Complete') ? 100 : (r.status === 'Not Started' ? 0 : null);
    }
  });

  populateFilters();
  renderLegend();
  buildTimeline();
  applyFilters();
}

function parentOf(ref){
  if(!ref) return null;
  const parts = ref.split('.');
  if(parts.length < 3) return null;
  return parts.slice(0, -1).join('.');
}

// ---------- filter dropdowns ----------
function unique(arr){ return Array.from(new Set(arr.filter(v => v!==null && v!==undefined && v!==''))).sort((a,b) => String(a).localeCompare(String(b))); }

function populateFilters(){
  filterOptions.dept = unique(ROWS.map(r => r.dept));
  filterOptions.status = ['Complete','On Track','At Risk','Not Started','No Update Received','TBC','Unknown'].filter(s => ROWS.some(r => r.status === s));
  filterOptions.tier = unique(ROWS.map(r => r.tier)).sort((a,b) => a-b).map(String);
  filterOptions.type = unique(ROWS.map(r => r.type));
  document.querySelectorAll('.dd').forEach(dd => buildDropdown(dd));
}

function buildDropdown(dd){
  const key = dd.dataset.key;
  const panel = dd.querySelector('.dd-panel');
  const opts = filterOptions[key];
  panel.innerHTML = `
    <input type="text" class="dd-search" placeholder="Filter..." />
    <div class="dd-actions">
      <button class="all" type="button">Select all</button>
      <button class="none" type="button">Clear</button>
    </div>
    <div class="dd-list">
      ${opts.map(v => `<label><input type="checkbox" value="${escapeHtml(v)}" /> <span>${escapeHtml(v)}</span></label>`).join('')}
    </div>
  `;
  const btn = dd.querySelector('.dd-btn');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = panel.classList.contains('open');
    document.querySelectorAll('.dd-panel').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.dd-btn').forEach(b => b.classList.remove('active'));
    if(!wasOpen){ panel.classList.add('open'); btn.classList.add('active'); }
  });
  panel.addEventListener('click', (e) => e.stopPropagation());
  panel.querySelector('.dd-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    panel.querySelectorAll('.dd-list label').forEach(lbl => {
      lbl.style.display = lbl.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  panel.querySelector('.all').addEventListener('click', () => {
    panel.querySelectorAll('.dd-list label:not([style*="none"]) input').forEach(cb => cb.checked = true);
    syncDropdown(dd);
  });
  panel.querySelector('.none').addEventListener('click', () => {
    panel.querySelectorAll('.dd-list input').forEach(cb => cb.checked = false);
    syncDropdown(dd);
  });
  panel.querySelectorAll('.dd-list input').forEach(cb => {
    cb.addEventListener('change', () => syncDropdown(dd));
  });
}

function syncDropdown(dd){
  const key = dd.dataset.key;
  const checked = Array.from(dd.querySelectorAll('.dd-list input:checked')).map(cb => cb.value);
  filters[key] = new Set(checked);
  const cnt = dd.querySelector('.dd-count');
  const lbl = dd.querySelector('.dd-lbl');
  if(checked.length === 0){
    cnt.classList.add('hidden');
    lbl.textContent = ({dept:'All departments',status:'All statuses',tier:'All tiers',type:'All types'})[key];
  } else if(checked.length === 1){
    cnt.classList.add('hidden');
    lbl.textContent = checked[0];
  } else {
    cnt.classList.remove('hidden');
    cnt.textContent = checked.length;
    lbl.textContent = ({dept:'Departments',status:'Statuses',tier:'Tiers',type:'Types'})[key];
  }
  applyFilters();
}

document.addEventListener('click', () => {
  document.querySelectorAll('.dd-panel').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.dd-btn').forEach(b => b.classList.remove('active'));
});

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function passesFilters(r){
  if(filters.dept.size && !filters.dept.has(r.dept)) return false;
  if(filters.status.size && !filters.status.has(r.status)) return false;
  if(filters.tier.size && !filters.tier.has(String(r.tier))) return false;
  if(filters.type.size && !filters.type.has(r.type)) return false;
  if(filters.search){
    const q = filters.search.toLowerCase();
    if(!r.deliverable.toLowerCase().includes(q) && !r.ref.toLowerCase().includes(q)) return false;
  }
  if(milestonesOnly && !/milestone/i.test(r.type)) return false;
  return true;
}

// ---------- timeline ----------
function buildTimeline(){
  const container = document.getElementById('timeline');
  const options = {
    stack: false,
    orientation: {axis: 'top'},
    zoomMin: 1000*60*60*24*3,
    zoomMax: 1000*60*60*24*365*3,
    horizontalScroll: true,
    verticalScroll: true,
    height: '100%',
    maxHeight: '100%',
    zoomKey: 'ctrlKey',
    margin: {item: 4, axis: 8},
    tooltip: {followMouse:true, overflowMethod:'flip', template: () => ''},
    template: (item) => item.htmlContent !== undefined ? item.htmlContent : (item.content || '')
  };
  timeline = new vis.Timeline(container, ITEMS, GROUPS, options);
  timeline.addCustomTime(new Date(), 'now');

  // custom tooltip
  const tt = document.createElement('div');
  tt.className = 'tt'; tt.style.position='fixed'; tt.style.pointerEvents='none'; tt.style.display='none'; tt.style.zIndex=1000;
  document.body.appendChild(tt);
  timeline.on('itemover', (props) => {
    const raw = ITEMS.get(props.item);
    if(!raw) return;
    const rowId = raw.rowId !== undefined ? raw.rowId : props.item;
    const r = ROWS[rowId];
    if(!r) return;
    tt.innerHTML = tooltipHtml(r, raw.isSummary);
    tt.style.display = 'block';
  });
  timeline.on('itemout', () => { tt.style.display='none'; });
  document.addEventListener('mousemove', (e) => {
    if(tt.style.display === 'block'){
      const pad = 14;
      let x = e.clientX + pad, y = e.clientY + pad;
      const rect = tt.getBoundingClientRect();
      if(x + rect.width > window.innerWidth) x = e.clientX - rect.width - pad;
      if(y + rect.height > window.innerHeight) y = e.clientY - rect.height - pad;
      tt.style.left = x+'px'; tt.style.top = y+'px';
    }
  });
}

function tooltipHtml(r, isSummary){
  const sm = r.statusMeta;
  const fmt = d => d ? d.toISOString().slice(0,10) : '<span style="color:#666">(none)</span>';
  const pctPart = showPct && r.pctCalc !== null
    ? `<div class="tt-row"><div class="tt-k">% Complete</div><div class="tt-v">${r.pctCalc}%${r.childrenIds.length?' <span style="color:'+sm.color+'">(calc from '+r.childrenIds.length+' child)</span>':''}</div></div>` : '';
  const cmt = r.comment ? `<div class="tt-row"><div class="tt-k">Comment</div><div class="tt-v">${escapeHtml(r.comment.slice(0,180))}${r.comment.length>180?'...':''}</div></div>` : '';
  const summaryFlag = isSummary ? '<div class="tt-row"><div class="tt-k"></div><div class="tt-v" style="color:var(--s21-mal);font-style:italic;font-size:10px">(rolled up from child dates)</div></div>' : '';
  return `<h4>${escapeHtml(r.deliverable || '(untitled)')}</h4>
    <div class="tt-row"><div class="tt-k">Status</div><div class="tt-v"><span class="st-pill ${sm.cls}" style="background:${sm.color}">${sm.label}</span></div></div>
    <div class="tt-row"><div class="tt-k">Department</div><div class="tt-v">${escapeHtml(r.dept)}</div></div>
    <div class="tt-row"><div class="tt-k">Tier / Type</div><div class="tt-v">Tier ${r.tier ?? '-'} · ${escapeHtml(r.type||'-')}</div></div>
    <div class="tt-row"><div class="tt-k">REF</div><div class="tt-v">${escapeHtml(r.ref||'-')}</div></div>
    <div class="tt-row"><div class="tt-k">SME</div><div class="tt-v">${escapeHtml(r.sme||'-')}</div></div>
    <div class="tt-row"><div class="tt-k">Start</div><div class="tt-v">${fmt(r.start)}</div></div>
    <div class="tt-row"><div class="tt-k">End</div><div class="tt-v">${fmt(r.end)}</div></div>
    ${pctPart}
    ${summaryFlag}
    ${cmt}`;
}

// ---------- render ----------

function el(tag, className, text){
  const e = document.createElement(tag);
  if(className) e.className = className;
  if(text != null) e.textContent = text;
  return e;
}

function buildRowLabel(r, hasVisibleChildren){
  const tier = r.tier || 'x';
  const wrap = el('div', 'row-line tier-'+tier);
  wrap.appendChild(el('span', 'indent'));
  const chev = el('span', 'chevron');
  if(hasVisibleChildren) chev.textContent = '▼';
  wrap.appendChild(chev);
  wrap.appendChild(el('span', 'tier-pill t-'+tier, 'T'+(r.tier ?? '-')));
  if(r.ref) wrap.appendChild(el('span', 'ref-pill', r.ref));
  const delivClass = hasVisibleChildren ? 'parent' : (r.tier >= 3 ? 'child' : '');
  const dv = el('span', 'deliv '+delivClass, r.deliverable || '(untitled)');
  dv.title = r.deliverable || '';
  wrap.appendChild(dv);
  if(r.sme){
    const sp = el('span', 'sme-pill', r.sme);
    sp.title = r.sme;
    wrap.appendChild(sp);
  }
  return wrap;
}

function buildDeptLabel(dept, count){
  const wrap = el('div', 'row-line dept-line');
  wrap.appendChild(el('span', 'dept-name', dept));
  wrap.appendChild(el('span', 'dept-count', count));
  return wrap;
}
function applyFilters(){
  filters.search = document.getElementById('f-search').value.trim();
  const visible = ROWS.filter(passesFilters);
  renderGroupsAndItems(visible);
  updateStats(visible);
  renderDrawer(visible);
}

function renderGroupsAndItems(visible){
  GROUPS.clear(); ITEMS.clear();

  const visibleIds = new Set(visible.map(v => v.id));
  const deptsPresent = Array.from(new Set(visible.map(r => r.dept))).sort();
  const byDept = {};
  visible.forEach(r => { (byDept[r.dept] = byDept[r.dept] || []).push(r); });

  const groups = [];
  const items = [];

  deptsPresent.forEach(dept => {
    const deptId = 'dept::'+dept;
    const deptRows = byDept[dept];
    const nestedIds = [];

    // build parent-child ordering within dept (only counting visible)
    const idSetHere = new Set(deptRows.map(r => r.id));
    const roots = deptRows.filter(r => {
      if(!r.parentRef) return true;
      // parent must be visible AND in same dept
      return !ROWS.some(x => x.ref === r.parentRef && idSetHere.has(x.id));
    }).sort((a,b) => (a.tier||9)-(b.tier||9) || a.ref.localeCompare(b.ref) || a.deliverable.localeCompare(b.deliverable));

    const ordered = [];
    const seen = new Set();
    function walk(r){
      if(seen.has(r.id)) return;
      seen.add(r.id);
      ordered.push(r);
      const kids = deptRows.filter(c => c.parentRef === r.ref).sort((a,b)=>a.ref.localeCompare(b.ref));
      kids.forEach(walk);
    }
    roots.forEach(walk);
    deptRows.forEach(r => { if(!seen.has(r.id)) ordered.push(r); });

    ordered.forEach(r => {
      const gid = 'row::'+r.id;
      nestedIds.push(gid);
      const visibleKids = deptRows.filter(c => c.parentRef === r.ref);
      const hasVisibleChildren = visibleKids.length > 0;
      groups.push({id: gid, content: buildRowLabel(r, hasVisibleChildren), treeLevel: 2});

      // build items
      // If row has its own start+end, always show a bar
      if(r.start && r.end){
        items.push({
          id: 'i-'+r.id, rowId: r.id,
          group: gid,
          start: r.start,
          end: r.end,
          type: 'range',
          className: r.statusMeta.cls,
          content: escapeHtml((r.deliverable||'').slice(0,32))
        });
      } else if(r.end || r.start){
        // point milestone: shape and colour set via className on the item
        const when = r.end || r.start;
        let shape = 'dot';
        if(/key milestone/i.test(r.type)) shape = 'triangle';
        else if(/sme milestone/i.test(r.type)) shape = 'rhombus';
        items.push({
          id: 'i-'+r.id, rowId: r.id,
          group: gid,
          start: when,
          type: 'point',
          className: 'shape-'+shape+' '+r.statusMeta.mark,
          content: ''
        });
      }
      // if fully undated AND has visible children, we'll add a summary bar below

      // parent summary bar (if children are visible)
      if(hasVisibleChildren){
        // collect date range from ALL currently visible descendants
        const descDates = [];
        function collectDates(node){
          const kids = deptRows.filter(c => c.parentRef === node.ref);
          kids.forEach(k => {
            if(k.start) descDates.push(k.start);
            if(k.end) descDates.push(k.end);
            collectDates(k);
          });
        }
        collectDates(r);
        if(descDates.length){
          const minD = new Date(Math.min.apply(null, descDates));
          const maxD = new Date(Math.max.apply(null, descDates));
          // only add if there's a real range OR the parent has no own dates
          const hasOwnRange = r.start && r.end;
          if(!hasOwnRange && minD.getTime() !== maxD.getTime()){
            items.push({
              id: 's-'+r.id, rowId: r.id, isSummary: true,
              group: gid,
              start: minD,
              end: maxD,
              type: 'range',
              className: 'summary'
            });
          }
        }
      }
    });

    groups.push({
      id: deptId,
      content: buildDeptLabel(dept, ordered.length),
      nestedGroups: nestedIds,
      treeLevel: 1,
      showNested: true
    });
  });

  GROUPS.add(groups);
  ITEMS.add(items);

  if(items.length){
    try{ timeline.fit({animation:false}); }catch(e){}
  }
}

function updateStats(visible){
  document.getElementById('stat-rows').textContent = ROWS.length;
  const onTl = visible.filter(r => r.start || r.end).length;
  const und = visible.filter(r => !r.start && !r.end).length;
  document.getElementById('stat-visible').textContent = onTl;
  document.getElementById('stat-undated').textContent = und;
  document.getElementById('undated-badge').textContent = und;
  document.getElementById('drawer-count').textContent = und;
}

function renderDrawer(visible){
  const tbody = document.querySelector('#undated-table tbody');
  const undated = visible.filter(r => !r.start && !r.end)
    .sort((a,b) => a.dept.localeCompare(b.dept) || (a.tier||9)-(b.tier||9) || a.ref.localeCompare(b.ref));
  tbody.innerHTML = undated.map(r => `
    <tr>
      <td style="color:var(--s21-mal)">${escapeHtml(r.ref||'-')}</td>
      <td>${escapeHtml(r.dept)}</td>
      <td>${r.tier ?? '-'}</td>
      <td>${escapeHtml(r.type||'-')}</td>
      <td>${escapeHtml(r.deliverable||'-')}</td>
      <td><span class="st-pill ${r.statusMeta.cls}" style="background:${r.statusMeta.color};padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700">${r.statusMeta.label}</span></td>
      <td>${escapeHtml(r.sme||'-')}</td>
    </tr>`).join('');
}

function renderLegend(){
  const el = document.getElementById('legend');
  const parts = Object.values(STATUS_MAP).filter(s => ROWS.some(r => r.status === s.label)).map(s =>
    `<span class="chip"><span class="swatch" style="background:${s.color}"></span>${s.label}</span>`
  );
  parts.push('<span class="divider"></span>');
  parts.push('<span class="chip"><span class="swatch" style="background:#fff;height:8px;width:22px;border-radius:2px"></span>Range (Start + End)</span>');
  parts.push('<span class="chip"><span class="swatch triangle"></span>Key Milestone</span>');
  parts.push('<span class="chip"><span class="swatch diamond" style="background:#fff"></span>SME Milestone</span>');
  parts.push('<span class="chip"><span class="swatch circle" style="background:#fff"></span>Other (single date)</span>');
  parts.push('<span class="divider"></span>');
  parts.push('<span class="chip"><span class="swatch" style="background:transparent;border:1px dashed rgba(26,226,121,.7)"></span>Rolled up (parent summary)</span>');
  parts.push('<span class="divider"></span>');
  parts.push('<span class="chip" style="gap:4px">Tiers <span style="background:#1AE279;color:#0D0C4E;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:800">T1</span><span style="background:#49D8CD;color:#0D0C4E;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:800">T2</span><span style="background:#6960EC;color:#fff;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:800">T3</span><span style="background:rgba(255,255,255,.18);color:#fff;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:800">T4</span></span>');
  el.innerHTML = parts.join('');
}

// ---------- controls ----------
function bindControls(){
  document.getElementById('f-search').addEventListener('input', applyFilters);
  document.querySelectorAll('.btn[data-scale]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.btn[data-scale]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      setScale(b.dataset.scale);
    });
  });
  document.getElementById('btn-today').addEventListener('click', () => {
    const now = new Date();
    timeline.moveTo(now, {animation:true});
  });
  document.getElementById('btn-expo').addEventListener('click', () => {
    timeline.setWindow(new Date('2027-06-01'), new Date('2027-12-31'), {animation:true});
  });
  document.getElementById('btn-milestones').addEventListener('click', (e) => {
    milestonesOnly = !milestonesOnly;
    e.currentTarget.classList.toggle('active', milestonesOnly);
    applyFilters();
  });
  document.getElementById('btn-pct').addEventListener('click', (e) => {
    showPct = !showPct;
    e.currentTarget.textContent = (showPct ? 'Hide' : 'Show') + ' % Complete';
    e.currentTarget.classList.toggle('active', showPct);
  });
  document.getElementById('btn-drawer').addEventListener('click', (e) => {
    const d = document.getElementById('drawer');
    d.classList.toggle('open');
    const btn = e.currentTarget;
    btn.classList.toggle('active', d.classList.contains('open'));
    // preserve the badge count element
    const badge = document.getElementById('undated-badge');
    const openState = d.classList.contains('open');
    btn.innerHTML = (openState ? 'Hide' : 'Show') + ' Undated ';
    btn.appendChild(badge);
    // trigger vis-timeline redraw so it recalculates height
    if(timeline) setTimeout(() => timeline.redraw(), 50);
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    document.querySelectorAll('.dd').forEach(dd => {
      dd.querySelectorAll('.dd-list input').forEach(cb => cb.checked = false);
      syncDropdown(dd);
    });
    document.getElementById('f-search').value = '';
    milestonesOnly = false;
    document.getElementById('btn-milestones').classList.remove('active');
    applyFilters();
  });
  document.getElementById('btn-retry').addEventListener('click', load);
}

function setScale(scale){
  if(!timeline) return;
  const w = timeline.getWindow();
  const center = new Date((w.start.getTime()+w.end.getTime())/2);
  let span;
  if(scale === 'day') span = 1000*60*60*24*7;
  else if(scale === 'week') span = 1000*60*60*24*90;
  else span = 1000*60*60*24*365*1.2;
  timeline.setWindow(new Date(center.getTime()-span/2), new Date(center.getTime()+span/2), {animation:true});
}

bindControls();
load();
</script>
</body>
