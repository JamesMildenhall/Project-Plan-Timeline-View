<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX27 Ops Command Center | Project Plan</title>
    
    <!-- Switch21 Brand Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Vis-Timeline for Gantt Visualization -->
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --federal-blue: #0D0C4E;
            --malachite: #1AE279;
            --mexican-pink: #E21A83;
            --medium-turquoise: #49D8CD;
            --mikado-yellow: #FFC40C;
            --dark-bg: #05051a; /* Deeper shade for command center contrast */
            --panel-bg: rgba(13, 12, 78, 0.6);
            --text-light: #ffffff;
            --text-muted: #AFAFEE;
            --border-color: #2F2E82;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header & Controls --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: linear-gradient(90deg, var(--federal-blue) 0%, var(--dark-bg) 100%);
            border-bottom: 2px solid var(--malachite);
        }

        .brand-title {
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-title span {
            color: var(--malachite);
        }

        .controls-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        select, button {
            background-color: var(--federal-blue);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, button:hover {
            border-color: var(--malachite);
            box-shadow: 0 0 10px rgba(26, 226, 121, 0.3);
        }

        button.active {
            background-color: var(--malachite);
            color: var(--federal-blue);
            border-color: var(--malachite);
        }

        /* --- Error Banner --- */
        #error-banner {
            display: none;
            background-color: var(--mexican-pink);
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
        }

        /* --- Timeline Container --- */
        #visualization {
            flex-grow: 1;
            width: 100%;
            padding: 1rem;
            background-color: var(--dark-bg);
        }

        /* --- Vis-Timeline Dark Mode Overrides --- */
        .vis-timeline {
            border: 1px solid var(--border-color);
            font-family: 'Montserrat', sans-serif;
        }
        
        .vis-panel.vis-background, 
        .vis-panel.vis-bottom, 
        .vis-panel.vis-center, 
        .vis-panel.vis-left, 
        .vis-panel.vis-right, 
        .vis-panel.vis-top {
            border-color: var(--border-color);
        }

        .vis-labelset .vis-label {
            color: var(--malachite);
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
        }

        .vis-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        .vis-grid.vis-minor, .vis-grid.vis-major {
            border-color: rgba(47, 46, 130, 0.4);
        }

        /* --- Custom Item Styling --- */
        .vis-item {
            border-radius: 4px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .vis-item:hover {
            transform: scale(1.02);
            z-index: 100 !important;
        }

        .vis-item .vis-item-content {
            padding: 4px 8px;
            color: var(--federal-blue);
        }

        /* Status Colors */
        .status-complete { background-color: var(--malachite); }
        .status-inprogress { background-color: var(--medium-turquoise); }
        .status-notstarted { background-color: #656485; color: white !important; }
        .status-notstarted .vis-item-content { color: white; }
        .status-atrisk { background-color: var(--mexican-pink); color: white !important;}
        .status-atrisk .vis-item-content { color: white; }
        .status-default { background-color: var(--mikado-yellow); }

        /* --- Custom Tooltip --- */
        .custom-tooltip {
            background: var(--federal-blue);
            border: 1px solid var(--malachite);
            padding: 12px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            min-width: 250px;
        }
        .custom-tooltip h4 {
            color: var(--malachite);
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .custom-tooltip p {
            margin: 4px 0;
            font-size: 0.85rem;
        }
        .custom-tooltip span {
            font-weight: 700;
            color: var(--medium-turquoise);
        }

        /* Hide native vis-tooltip to use HTML title gracefully */
        .vis-tooltip {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            EXPO 2027 <span>OPS COMMAND CENTER</span>
        </div>
        <div class="controls-container">
            <div class="control-group">
                <label for="filter-dept">Department</label>
                <select id="filter-dept">
                    <option value="ALL">All Departments</option>
                </select>
            </div>
            <div class="control-group">
                <label for="filter-status">Status</label>
                <select id="filter-status">
                    <option value="ALL">All Statuses</option>
                </select>
            </div>
            <div class="control-group" style="margin-left: 20px;">
                <button class="scale-btn" data-scale="day">Day</button>
                <button class="scale-btn" data-scale="week">Week</button>
                <button class="scale-btn active" data-scale="month">Month</button>
            </div>
        </div>
    </header>

    <div id="error-banner"></div>
    <div id="visualization"></div>

    <script>
        const FILE_PATH = './EX27_Ops_Project_Plan_v4.xlsx';
        let timeline;
        let itemsDataset;
        let groupsDataset;
        let rawData = [];

        // DOM Elements
        const errorBanner = document.getElementById('error-banner');
        const deptFilter = document.getElementById('filter-dept');
        const statusFilter = document.getElementById('filter-status');
        const scaleButtons = document.querySelectorAll('.scale-btn');

        // Initialize App
        async function init() {
            try {
                const response = await fetch(FILE_PATH);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
                
                const sheetName = 'Tracker';
                const worksheet = workbook.Sheets[sheetName];
                
                if (!worksheet) throw new Error(`Sheet named "${sheetName}" not found in file.`);

                // Parse data starting from row 8 (index 7)
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { 
                    range: 7, 
                    raw: false, 
                    dateNF: 'yyyy-mm-dd' 
                });

                if (jsonData.length === 0) throw new Error("No data found in the specified range.");

                processData(jsonData);
                setupFilters();
                setupTimeline();
                
            } catch (error) {
                console.error("Initialization Error:", error);
                showError(`Failed to load project plan: ${error.message}`);
            }
        }

        // Process Excel Data
        function processData(data) {
            rawData = data.map((row, index) => {
                const deliverable = row['Deliverable'] || 'Unnamed Task';
                const start = row['Start Date'];
                const end = row['End Date'];
                const department = row['Department'] || 'Unassigned';
                const status = row['Status'] || 'Not Started';
                const sme = row['SME / SME'] || 'TBD';
                const percent = row['% Complete'] || '0%';
                const tier = row['Tier'] || '';

                return {
                    id: index,
                    deliverable,
                    start,
                    end,
                    department,
                    status,
                    sme,
                    percent,
                    tier
                };
            }).filter(item => item.start && item.end); // Only keep items with valid dates
        }

        // Setup Dropdown Filters
        function setupFilters() {
            const departments = [...new Set(rawData.map(i => i.department))].sort();
            const statuses = [...new Set(rawData.map(i => i.status))].sort();

            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                deptFilter.appendChild(option);
            });

            statuses.forEach(status => {
                const option = document.createElement('option');
                option.value = status;
                option.textContent = status;
                statusFilter.appendChild(option);
            });

            deptFilter.addEventListener('change', updateTimelineData);
            statusFilter.addEventListener('change', updateTimelineData);
        }

        // Determine CSS class based on status
        function getStatusClass(status) {
            const s = status.toLowerCase();
            if (s.includes('complete')) return 'status-complete';
            if (s.includes('progress')) return 'status-inprogress';
            if (s.includes('risk') || s.includes('delay')) return 'status-atrisk';
            if (s.includes('not start')) return 'status-notstarted';
            return 'status-default';
        }

        // Generate Tooltip HTML
        function generateTooltip(item) {
            return `
                <div class="custom-tooltip">
                    <h4>${item.deliverable}</h4>
                    <p><span>Department:</span> ${item.department}</p>
                    <p><span>Status:</span> ${item.status} (${item.percent})</p>
                    <p><span>SME:</span> ${item.sme}</p>
                    <p><span>Tier:</span> ${item.tier}</p>
                </div>
            `;
        }

        // Setup Vis-Timeline
        function setupTimeline() {
            const container = document.getElementById('visualization');
            
            groupsDataset = new vis.DataSet();
            itemsDataset = new vis.DataSet();

            const options = {
                orientation: 'top',
                stack: true,
                margin: { item: 10, axis: 5 },
                tooltip: {
                    followMouse: true,
                    overflowMethod: 'cap'
                }
            };

            timeline = new vis.Timeline(container, itemsDataset, groupsDataset, options);
            updateTimelineData();
            
            // Set initial scale to Month
            setScale('month');

            // Scale button listeners
            scaleButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    scaleButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    setScale(e.target.dataset.scale);
                });
            });
        }

        // Filter and Update Data in Timeline
        function updateTimelineData() {
            const selectedDept = deptFilter.value;
            const selectedStatus = statusFilter.value;

            const filteredData = rawData.filter(item => {
                const matchDept = selectedDept === 'ALL' || item.department === selectedDept;
                const matchStatus = selectedStatus === 'ALL' || item.status === selectedStatus;
                return matchDept && matchStatus;
            });

            // Extract unique groups from filtered data
            const groups = [...new Set(filteredData.map(i => i.department))].sort().map((dept, index) => ({
                id: dept,
                content: dept
            }));

            // Format items for Vis-Timeline
            const items = filteredData.map(item => ({
                id: item.id,
                group: item.department,
                content: item.deliverable,
                start: new Date(item.start),
                end: new Date(item.end),
                className: getStatusClass(item.status),
                title: generateTooltip(item)
            }));

            groupsDataset.clear();
            groupsDataset.add(groups);
            
            itemsDataset.clear();
            itemsDataset.add(items);

            if (items.length > 0) {
                timeline.fit({ animation: false });
            }
        }

        // Handle Scale Toggles
        function setScale(scaleType) {
            if (itemsDataset.length === 0) return;
            
            const range = timeline.getItemRange();
            if(!range.min || !range.max) return;

            const start = new Date(range.min);
            const end = new Date();
            
            if (scaleType === 'day') {
                // ~2 weeks window
                end.setTime(start.getTime() + 14 * 24 * 60 * 60 * 1000); 
            } else if (scaleType === 'week') {
                // ~2 months window
                end.setTime(start.getTime() + 60 * 24 * 60 * 60 * 1000); 
            } else if (scaleType === 'month') {
                // fit all
                timeline.fit();
                return; 
            }
            timeline.setWindow(start, end);
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.style.display = 'block';
        }

        // Boot
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
